name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set +e
          npm install --no-audit --no-fund > npm.log 2>&1; code=$?
          cat npm.log
          if [ $code -ne 0 ]; then echo "::error title=npm install::$(grep -v 'warn deprecated' npm.log | tail -c 3000 | tr '\n' '|')"; fi
          exit $code
      - name: Align Expo SDK versions
        run: npx expo install --check || true
      - name: Type check
        run: |
          set +e
          npx tsc --noEmit > tsc.log 2>&1; code=$?
          cat tsc.log
          if [ $code -ne 0 ]; then echo "::error title=tsc::$(head -c 3000 tsc.log | tr '\n' '|')"; fi
          exit $code
      - name: Expo doctor
        run: npx expo-doctor || true
      - name: Bundle for iOS
        run: |
          set +e
          npx expo export --platform ios > export.log 2>&1; code=$?
          cat export.log
          if [ $code -ne 0 ]; then echo "::error title=expo export::$(tail -c 3000 export.log | tr '\n' '|')"; fi
          exit $code
      - name: Bundle for Android
        run: |
          set +e
          npx expo export --platform android > export-android.log 2>&1; code=$?
          cat export-android.log
          if [ $code -ne 0 ]; then echo "::error title=expo export android::$(tail -c 3000 export-android.log | tr '\n' '|')"; fi
          exit $code
      - name: Android project and manifest (prebuild)
        run: |
          set +e
          npx expo prebuild --platform android --no-install > prebuild.log 2>&1; code=$?
          tail -n 40 prebuild.log
          if [ $code -ne 0 ]; then echo "::error title=prebuild android::$(tail -c 3000 prebuild.log | tr '\n' '|')"; exit $code; fi
          M=android/app/src/main/AndroidManifest.xml
          echo "--- manifest"; cat "$M"
          echo "--- permissions that stay"
          grep 'uses-permission' "$M" | grep -v 'tools:node="remove"' | sed -E 's/.*android:name="([^"]*)".*/\1/' | sort
          # Выгрузка в календарь на Android выключена: разрешения на календарь не должны попасть в сборку
          if grep -E 'READ_CALENDAR|WRITE_CALENDAR' "$M" | grep -v 'tools:node="remove"'; then
            echo "::error title=calendar permission::READ/WRITE_CALENDAR попали в манифест Android"; exit 1
          fi
          grep -q 'android:scheme="vdvoem"' "$M" || { echo "::error title=deep link::в манифесте нет схемы vdvoem"; exit 1; }
          grep -q 'android:allowBackup="false"' "$M" || echo "::warning title=allowBackup::allowBackup не выключен"
          for f in mipmap-anydpi-v26/ic_launcher.xml drawable-mdpi/notification_icon.png; do
            find android/app/src/main/res -path "*$f" | grep -q . || echo "::warning title=android icon::нет $f"
          done
          grep -q 'monochrome' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || echo "::warning title=monochrome::в адаптивной иконке нет monochrome"

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and RLS checks
        run: |
          set -o pipefail
          run() { psql -v ON_ERROR_STOP=1 -X -q -f "$1" 2>&1 | tee -a db.log; }
          {
            run supabase/tests/auth_stub.sql &&
            run supabase/tests/storage_stub.sql &&
            run supabase/migrations/0001_init.sql &&
            run supabase/migrations/0002_calendar_chat_files.sql &&
            echo "--- rerun 0002 (idempotent)" | tee -a db.log &&
            run supabase/migrations/0002_calendar_chat_files.sql &&
            run supabase/migrations/0003_reactions_wish_photos.sql &&
            echo "--- rerun 0003 (idempotent)" | tee -a db.log &&
            run supabase/migrations/0003_reactions_wish_photos.sql &&
            run supabase/migrations/0004_security_hardening.sql &&
            echo "--- rerun 0004 (idempotent)" | tee -a db.log &&
            run supabase/migrations/0004_security_hardening.sql &&
            psql -v ON_ERROR_STOP=1 -X -t -A -f supabase/tests/rls_v2_test.sql 2>&1 | tee -a db.log &&
            psql -v ON_ERROR_STOP=1 -X -t -A -f supabase/tests/rls_v3_test.sql 2>&1 | tee -a db.log &&
            psql -v ON_ERROR_STOP=1 -X -t -A -f supabase/tests/rls_v4_test.sql 2>&1 | tee -a db.log
          }; code=$?
          if [ $code -ne 0 ]; then echo "::error title=db::$(tail -c 3000 db.log | tr '\n' '|')"; exit $code; fi
          if grep -qx 'f' db.log; then echo "::error title=db checks::$(grep -n -x 'f' db.log | head) |$(tail -c 2500 db.log | tr '\n' '|')"; exit 1; fi
          echo "::notice title=db ok::$(grep -c -x 't' db.log) checks passed; $(grep -c 'blocked ok' db.log) blocked as expected"
      - name: Demo seed for App Review
        run: |
          set -e
          psql -v ON_ERROR_STOP=1 -X -q -c "insert into auth.users (id, email) values ('11111111-1111-1111-1111-111111111111', 'reviewer@ci.test'), ('22222222-2222-2222-2222-222222222222', 'partner@ci.test')"
          sed -e "s/demo-reviewer@example.com'; /reviewer@ci.test'; /" -e "s/demo-partner@example.com'; /partner@ci.test'; /" supabase/demo/seed_demo.sql > "$RUNNER_TEMP/seed.sql"
          psql -v ON_ERROR_STOP=1 -X -q -f "$RUNNER_TEMP/seed.sql"
          echo "--- rerun (idempotent)"
          psql -v ON_ERROR_STOP=1 -X -q -f "$RUNNER_TEMP/seed.sql"

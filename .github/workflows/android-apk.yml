name: Android APK (тестовая сборка)

# Собирает установочный APK прямо на GitHub, без аккаунта Expo и без Android Studio.
# Запуск вручную: вкладка Actions → «Android APK (тестовая сборка)» → Run workflow.
# Готовый файл — в закрытом черновике релиза (вкладка Releases, виден только владельцу) и в Artifacts запуска.
# Подпись у этого APK тестовая: ставить на свои телефоны можно, в магазины такой файл не загружают
# (для Google Play и RuStore — сборки EAS, см. store/google-play.md).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" > ../gradle.log 2>&1; code=$?
          tail -n 80 ../gradle.log
          if [ $code -ne 0 ]; then echo "::error title=gradle::$(grep -E 'error:|FAILED|What went wrong|Execution failed' -A3 ../gradle.log | head -c 3000 | tr '\n' '|')"; fi
          exit $code
      - name: Show result
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk vmeste-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vmeste-android-apk
          path: vmeste-android.apk
          retention-days: 14
      - name: Draft release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-test-${GITHUB_RUN_NUMBER}" vmeste-android.apk \
            --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
            --title "Вместе для Android (тестовая сборка ${GITHUB_RUN_NUMBER})" \
            --notes "Тестовая сборка для Android. Скачайте файл vmeste-android.apk на телефон и откройте его. Если Android спросит, разрешите установку из этого источника. Это не магазинная версия."

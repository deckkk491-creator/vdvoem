name: Upgrade Expo SDK
on:
  push:
    branches: [sdk58]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade
        run: |
          set -x
          npm view expo@latest version
          npm view expo dist-tags
          npm install --no-audit --no-fund expo@^58.0.0
          npx expo install --fix 2>&1 | tee upgrade.log
          npx expo install --check 2>&1 | tee -a upgrade.log || true
          npx tsc --noEmit 2>&1 | tee tsc.log || true
          npx expo-doctor 2>&1 | tee doctor.log || true
          mkdir -p .upgrade && mv upgrade.log tsc.log doctor.log .upgrade/
          git config user.name deckkk491-creator
          git config user.email deckkk491@gmail.com
          git rm -q --cached .github/workflows/upgrade-sdk.yml
          rm .github/workflows/upgrade-sdk.yml
          git add -A
          git add -f package-lock.json .upgrade
          git commit -m "Обновление до Expo SDK 58 (expo install --fix)" || true
          git push origin HEAD:sdk58-result

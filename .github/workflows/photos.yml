name: Landmark photos
on:
  push:
    branches: [photos]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Landmark photos
        run: |
          python3 .github/landmarks/fetch_landmarks.py .github/landmarks/landmarks.json src/data/countryPhotos.json | tee landmarks.log
          echo "::notice title=landmarks::$(grep -v ': OK' landmarks.log | tr '\n' '|')"
          python3 -c "import json;d=json.load(open('src/data/countryPhotos.json'));print('::notice title=counts::'+' '.join(f'{k}={len(v)}' for k,v in d.items()))"
      - name: Commit
        run: |
          git config user.name deckkk491-creator
          git config user.email deckkk491@gmail.com
          git checkout -b photos-result
          git rm -rq --cached .github/landmarks .github/workflows/photos.yml
          git add src/data/countryPhotos.json
          git commit -m "Фото достопримечательностей стран (Wikimedia Commons)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push -f origin photos-result
